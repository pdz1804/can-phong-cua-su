version: 2
# commit-message keeps Dependabot PR titles conventional ("chore(deps): bump ..."), which the CI
# PR-title check requires. three is pinned on purpose: models and materials are tuned against it.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: chore, prefix-development: chore, include: scope }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: '*', update-types: [version-update:semver-major] }
      - { dependency-name: three }
      - { dependency-name: '@types/three' }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: ci, include: scope }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
